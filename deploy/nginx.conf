server {
    listen 80;
    server_name _;

    # PWA static shell
    root /usr/share/nginx/html;
    index index.html;

    # html: never cache (shell evolves)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }

    # long-cache immutable assets, no-cache shell
    location ~* \.(svg|png|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # player + admin API → gateway
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /seamless/ {
        # provider callbacks arrive here in production too (signed)
        proxy_pass http://gateway:8081;
        proxy_set_header Host $host;
    }
    location /healthz {
        proxy_pass http://gateway:8081;
    }

    # game provider (H5 pages + its API) under one origin → no CORS pain.
    # ^~ so the .svg/.js regex cache block below does NOT capture these.
    location ^~ /game/ {
        proxy_pass http://provider-mock:8082;
        proxy_set_header Host $host;
    }

    # everything else → shell (SPA-style fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
